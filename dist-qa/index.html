<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#140f1e" />
    <meta name="description" content="The Last Gate - hold the wall against the Demon King." />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
    <link rel="icon" href="./icons/icon-512.png" sizes="512x512" />
    <title>The Last Gate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* The letterbox around a portrait game on a wide screen. Painted so
           it reads as a frame rather than a rendering failure. */
        background:
          radial-gradient(ellipse at 50% 30%, #24182f 0%, #120c1a 60%, #0a0710 100%);
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        font-family: 'Fredoka', system-ui, sans-serif;
      }
      /*
        Pinned to the top-left and sized in JS from window.visualViewport.
        Deliberately NOT centred here: Phaser centres the canvas inside this
        box itself, and doing it in CSS as well displaces the canvas by half
        the letterbox - which moves the picture away from its hit areas.
      */
      #game {
        position: fixed;
        left: 0;
        top: 0;
        overflow: hidden;
      }
      #game canvas { display: block; touch-action: none; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        text-align: center;
        color: #c8b28a;
        background: #0d0a14;
        transition: opacity .4s ease;
      }
      #boot h1 { margin: 0; font-size: 28px; letter-spacing: .18em; color: #f5c542; }
      #boot p { margin: 0; font-size: 14px; opacity: .7; }
      #boot.hide { opacity: 0; pointer-events: none; }
    </style>
    <script type="module" crossorigin src="./assets/index-BF5wsmqu.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-CbXtAM7H.js">
    <link rel="modulepreload" crossorigin href="./assets/phaser-D7WWxiZK.js">
  </head>
  <body>
    <div id="game"></div>
    <div id="boot"><h1>THE LAST GATE</h1><p>loading&hellip;</p></div>
  </body>
</html>
