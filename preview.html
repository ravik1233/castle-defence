<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Last Gate - art sheet</title>
    <style>
      body { margin: 0; background: #1b1626; color: #f4ecdd; font-family: system-ui, sans-serif; }
      h2 { padding: 12px 16px 0; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #c8b28a; }
      .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; padding: 10px 16px 20px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; background: linear-gradient(180deg,#2a2438,#191325); border: 1px solid #3a3350; border-radius: 10px; padding: 8px 6px 4px; }
      .cell img { display: block; height: 180px; width: auto; image-rendering: auto; }
      .cell.small img { height: 120px; }
      .cell span { font-size: 10px; color: #a99cc4; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
