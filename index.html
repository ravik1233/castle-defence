<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#140f1e" />
    <meta name="description" content="The Last Gate - hold the wall against the Demon King." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>The Last Gate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0a14;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Fredoka', system-ui, sans-serif;
      }
      #game { width: 100%; height: 100%; }
      #game canvas { display: block; touch-action: none; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        text-align: center;
        color: #c8b28a;
        background: #0d0a14;
        transition: opacity .4s ease;
      }
      #boot h1 { margin: 0; font-size: 28px; letter-spacing: .18em; color: #f5c542; }
      #boot p { margin: 0; font-size: 14px; opacity: .7; }
      #boot.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot"><h1>THE LAST GATE</h1><p>loading&hellip;</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
