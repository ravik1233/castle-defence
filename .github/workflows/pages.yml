# Publishes the playable build to GitHub Pages.
#
# This is the build people test on a phone, so it is made with QA=1: the
# deep links the testing guide relies on (?unlock=1, ?reach=2, ?scene=Battle)
# only exist in a QA bundle. The Play Store build is made separately, without
# it, so those hooks never reach a paying player.
name: Pages

on:
  push:
    branches:
      - main
      - claude/mobile-castle-defense-game-rvr0m4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the testable bundle
        run: QA=1 npx vite build
      # Turns Pages on for the repository the first time this runs, so nobody
      # has to go and find the setting.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
